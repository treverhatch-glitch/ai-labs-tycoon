# Self-hosted Unity on box-unity (6000.3.0f1); no GameCI docker / UNITY_LICENSE secret.
name: unity

on:
  pull_request:
    paths:
      - 'unity/**'
      - '.github/workflows/unity.yml'
      - 'Rules/**'
  workflow_dispatch:

concurrency:
  group: unity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_EDITOR: ${{ vars.UNITY_EDITOR || '/home/box/Unity/Hub/Editor/6000.3.0f1/Editor/Unity' }}

jobs:
  editmode:
    name: Unity Edit Mode
    runs-on: [self-hosted, unity-box]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Project present
        id: project
        run: |
          if [ -f unity/ProjectSettings/ProjectVersion.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Unity project yet
        if: steps.project.outputs.ready != 'true'
        run: echo "unity/ProjectSettings/ProjectVersion.txt missing; workflow passes without running Unity."

      - name: Prepare artifacts
        if: steps.project.outputs.ready == 'true'
        run: mkdir -p "$GITHUB_WORKSPACE/unity/artifacts"

      - name: Edit Mode tests
        if: steps.project.outputs.ready == 'true'
        run: |
          set -euo pipefail
          "$UNITY_EDITOR" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE/unity" \
            -runTests -testPlatform editmode \
            -testResults "$GITHUB_WORKSPACE/unity/artifacts/editmode-results.xml" \
            -logFile "$GITHUB_WORKSPACE/unity/artifacts/editmode.log"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always() && steps.project.outputs.ready == 'true'
        with:
          name: Unity EditMode artifacts
          path: unity/artifacts/
          if-no-files-found: warn

  capture:
    name: Unity HQ capture
    runs-on: [self-hosted, unity-box]
    needs: editmode
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Prepare artifacts
        run: mkdir -p "$GITHUB_WORKSPACE/unity/artifacts"

      - name: Capture screenshots (xvfb, graphics on)
        run: |
          set -euo pipefail
          xvfb-run -a "$UNITY_EDITOR" -batchmode -quit \
            -projectPath "$GITHUB_WORKSPACE/unity" \
            -runTests -testPlatform editmode \
            -testFilter "Captures_" \
            -logFile "$GITHUB_WORKSPACE/unity/artifacts/capture.log"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HQ view capture
          path: |
            unity/artifacts/hq-view.png
            unity/artifacts/hq-starter-office.png
          if-no-files-found: warn