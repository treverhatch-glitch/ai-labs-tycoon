# GameCI compile gate for unity/ (Edit Mode). Secrets only on the test-runner step.
name: unity

on:
  pull_request:
    paths:
      - 'unity/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

concurrency:
  group: unity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Unity Edit Mode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Project present
        id: project
        run: |
          if [ -f unity/ProjectSettings/ProjectVersion.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Unity project yet
        if: steps.project.outputs.ready != 'true'
        run: echo "unity/ProjectSettings/ProjectVersion.txt missing; workflow passes without running Unity."

      - uses: actions/cache@v4
        if: steps.project.outputs.ready == 'true'
        with:
          path: unity/Library
          key: unity-Library-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**', 'Rules/**') }}
          restore-keys: |
            unity-Library-

      - uses: game-ci/unity-test-runner@v4
        if: steps.project.outputs.ready == 'true'
        id: unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: auto
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cliVersion: v0.1.75

      - uses: actions/upload-artifact@v4
        if: always() && steps.project.outputs.ready == 'true' && steps.unity.outcome != 'skipped'
        with:
          name: Unity EditMode artifacts
          path: ${{ steps.unity.outputs.artifactsPath }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.project.outputs.ready == 'true' && steps.unity.outcome == 'success'
        with:
          name: HQ view capture
          path: unity/artifacts/hq-view.png
          if-no-files-found: error