name: rules

# Plain C# SimTests + two-year SimCli. Era PRs skip Category=LongRunning; workflow_dispatch full suite.
# Large merge refs (era/graphics gates) may exceed 60m wall clock; job cap 90m. PR subset uses blame-hang (15m) for stuck tests; golden-revert shells can be quiet during nested builds.
# Runs on pull requests and by hand only. No push trigger; a new push cancels the in-flight run on the same PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rules tests (PR subset)
        if: github.event_name == 'pull_request'
        run: dotnet test tools/SimTests -c Release --filter "Category!=LongRunning" --blame-hang-timeout 15m --logger "console;verbosity=minimal"
      - name: Rules tests (full)
        if: github.event_name != 'pull_request'
        run: dotnet test tools/SimTests -c Release --blame-hang-timeout 5m --logger "console;verbosity=minimal"
      - name: A two-year game still plays headless
        run: dotnet run --project tools/SimCli -c Release -- run --years 2