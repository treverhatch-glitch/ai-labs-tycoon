name: rules

# Plain C# SimTests + two-year SimCli. Era PRs skip Category=LongRunning; workflow_dispatch full suite.
# PR subset: single-threaded SimTests to keep golden-revert git checkouts safe; blame-hang fails true hangs in 5m.
# No push trigger; a new push cancels the in-flight run on the same PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 120 || 90 }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rules tests (PR subset)
        if: github.event_name == 'pull_request'
        timeout-minutes: 110
        run: dotnet test tools/SimTests -c Release --filter "Category!=LongRunning" --blame-hang-timeout 5m --blame-hang-dump-type mini -- RunConfiguration.MaxCpuCount=1 --logger "console;verbosity=minimal"
      - name: Rules tests (full)
        if: github.event_name != 'pull_request'
        timeout-minutes: 85
        run: dotnet test tools/SimTests -c Release --blame-hang-timeout 5m --logger "console;verbosity=minimal"
      - name: A two-year game still plays headless
        timeout-minutes: 20
        run: dotnet run --project tools/SimCli -c Release -- run --years 2