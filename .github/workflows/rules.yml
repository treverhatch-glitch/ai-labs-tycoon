name: rules

# Plain C# SimTests + two-year SimCli (main 69231943/Q736: 60m cap). Era PRs skip Category=LongRunning; workflow_dispatch full suite.
# Full SimTests on era-sized merge refs can take ~35–40m; main-shaped branches are much faster.
# Runs on pull requests and by hand only. No push trigger; a new push cancels the in-flight run on the same PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rules tests (PR subset)
        if: github.event_name == 'pull_request'
        run: dotnet test tools/SimTests -c Release --filter "Category!=LongRunning" --logger "console;verbosity=minimal"
      - name: Rules tests (full)
        if: github.event_name != 'pull_request'
        run: dotnet test tools/SimTests -c Release --blame-hang-timeout 5m --logger "console;verbosity=minimal"
      - name: A two-year game still plays headless
        run: dotnet run --project tools/SimCli -c Release -- run --years 2